spring.application.name=KickbasePlaner
# Set KICKBASE_CREDENTIALS_ENCRYPTION_KEY to a base64-encoded 32-byte key before saving accounts.
# Credentials are stored in ${user.home}/.kickbase-planer/managers.enc unless this path is overridden.
# Set KICKBASE_ADMIN_PASSWORD to enable the admin login (username: admin).
# Manager tokens default to 4 per week and are stored in ${user.home}/.kickbase-planer/tokens.properties.
kickbase.admin.password=${KICKBASE_ADMIN_PASSWORD:}
kickbase.tokens.weekly-count=4
